sudo: false

language: cpp

os:
  - linux

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
    packages:
      - cmake
      - g++-7

env:
  global:
    # Penguin settings
    - PENGUIN_ROOT=$TRAVIS_BUILD_DIR
    - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$PENGUIN_ROOT/lib

branches:
  only:
    - develop
    - master

matrix:
  include:
    - compiler: gcc
      env: COMPILER=g++-7

    - compiler: clang
      env: COMPILER=clang++-6.0
      addons:
        apt:
         sources:
          - llvm-toolchain-trusty-6.0
         packages:
          - clang-6.0

script:
  - export CXX=${COMPILER}
  - $CXX --version
  - cmake --version
  - cmake .
  - make -j2
  - ctest -j2
