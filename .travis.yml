sudo: false

language: cpp

os:
  - linux

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
    packages:
      - cmake

env:
  global:
    # Penguin settings
    - PENGUIN_ROOT=$TRAVIS_BUILD_DIR
    - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$PENGUIN_ROOT/lib

branches:
  only:
    - develop
    - master

matrix:
  include:
    - compiler: gcc
      env: COMPILER=g++-8
      addons:
        apt:
         packages:
          - g++-8
    - compiler: clang
      env: COMPILER=clang++-7
      addons:
        apt:
         sources:
          - llvm-toolchain-trusty-7
         packages:
          - clang-7
          - libstdc++-7-dev

script:
  - export CXX=${COMPILER}
  - $CXX --version
  - cmake --version
  - cmake .
  - make -j2
  - ctest -j2
